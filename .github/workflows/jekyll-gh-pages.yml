# Workflow for building and deploying the Vite + React TypeScript app to GitHub Pages
name: Deploy Vite React App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Đã thêm --legacy-peer-deps vào lệnh bên dưới để sửa lỗi xung đột NPM
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite production bundle
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Build Vite production bundle
        run: npm run build
        env:
          VITE_TUVUNG_FIREBASE_API_KEY: ${{ secrets.VITE_TUVUNG_FIREBASE_API_KEY }}
          VITE_NGUPHAP_FIREBASE_API_KEY: ${{ secrets.VITE_NGUPHAP_FIREBASE_API_KEY }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
